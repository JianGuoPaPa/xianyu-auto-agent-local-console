name: Feature request
description: Suggest an improvement or integration.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow are you trying to improve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like this project to support?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - AI reply
        - Auto delivery
        - Dashboard
        - Cookie sync
        - Windows scheduled task
        - Model provider
        - Documentation
        - Other
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Screenshots, examples, or related projects are helpful.
